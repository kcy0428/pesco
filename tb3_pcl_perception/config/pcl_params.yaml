# D435i 포인트클라우드 처리 파라미터 (레퍼런스 pcl_params.yaml 참고)
# 체인: 원본 cloud -> voxel 다운샘플 -> 통계적 outlier 제거 -> filtered cloud

voxel_grid:
  ros__parameters:
    # 다운샘플 격자 크기(m). 클수록 점 수↓/CPU↓ (Pi5 고려해 5cm)
    leaf_size: 0.05
    filter_field_name: "z"
    filter_limit_min: 0.3      # D435i 신뢰 최소거리
    filter_limit_max: 4.0      # 신뢰 최대거리 (먼 노이즈 제거)
    filter_limit_negative: false
    input_frame: ""
    output_frame: ""

statistical_outlier_removal:
  ros__parameters:
    # 각 점의 이웃 k개 평균거리 기준으로 이상치 제거 (떠다니는 노이즈 점 제거)
    mean_k: 20
    stddev: 1.0

# pointcloud_to_laserscan: 3D cloud 를 2D 가상 스캔으로 (저상 장애물 감지 보조)
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_footprint"
    transform_tolerance: 0.1
    min_height: 0.05           # 바닥 약간 위
    max_height: 0.5            # 로봇 높이 근처까지
    angle_min: -0.68           # D435i 수평 FOV (~±39도)
    angle_max: 0.68
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.3
    range_max: 4.0
    use_inf: true
